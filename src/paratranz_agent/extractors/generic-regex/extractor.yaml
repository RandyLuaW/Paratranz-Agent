id: generic-regex
name: 通用正则
name_en: Generic regex
engine: generic
version: 1.0.0
desc: 扫文本文件按正则抓取。适合 Ren'Py 的 .rpy 对话、自定义 txt/csv/ini。
desc_en: Scan text files with a regex. Good for Ren'Py .rpy dialogue and custom txt/csv/ini.
input_hint: 指向游戏根目录
input_hint_en: Point at the game root
entry: run.py
builtin: true
args:
  - name: glob
    label: 文件匹配
    label_en: File pattern
    default: "**/*.rpy"
    hint: Ren'Py 用 **/*.rpy，纯文本用 **/*.txt
    hint_en: "**/*.rpy for Ren'Py, **/*.txt for plain text"
  - name: pattern
    label: 正则
    label_en: Regex
    default: '"([^"\n]{2,})"'
    hint: 默认抓双引号内的字符串；**不要允许跨行**（含 \n 的匹配会让行号定位失效，回写时无法还原）
    hint_en: Defaults to strings inside double quotes; **do not let it span lines** (a match containing \n breaks line-number locators, so writeback cannot restore them)
  - name: group
    label: 取第几组
    label_en: Capture group
    default: "1"
  - name: min_len
    label: 最短长度
    label_en: Min length
    default: "2"
  - name: max_len
    label: 最长长度
    label_en: Max length
    default: "5000"
  - name: encoding
    label: 编码
    label_en: Encoding
    default: "utf-8"
