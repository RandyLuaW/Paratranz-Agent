[project]
name = "paratranz-agent"
version = "0.1.0"
description = "Agent-driven automation for ParaTranz localization projects: task planning, MT, review, glossary, style guide"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ptz = "paratranz_agent.cli:app"

[project.urls]
Homepage = "https://github.com/RandyLuaW/Paratranz-Agent"
Issues = "https://github.com/RandyLuaW/Paratranz-Agent/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paratranz_agent"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"
